[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimem"
version = "0.1.0"
description = "Reusable personal-memory retrieval engine: filesystem first, chat later"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "requests>=2.28",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "torch>=2.3"]
docs = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1"]
pinyin = ["pypinyin>=0.51"]
dev = ["pytest>=8.0"]

[project.scripts]
aimem = "aimem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
